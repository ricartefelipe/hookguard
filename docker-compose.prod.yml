services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${HOOKGUARD_DB_NAME:-hookguard}
      POSTGRES_USER: ${HOOKGUARD_DB_USER:-hookguard}
      POSTGRES_PASSWORD: ${HOOKGUARD_DB_PASSWORD:?set HOOKGUARD_DB_PASSWORD}
    volumes:
      - hookguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      HOOKGUARD_DB_URL: jdbc:postgresql://postgres:5432/${HOOKGUARD_DB_NAME:-hookguard}
      HOOKGUARD_DB_USER: ${HOOKGUARD_DB_USER:-hookguard}
      HOOKGUARD_DB_PASSWORD: ${HOOKGUARD_DB_PASSWORD}
      HOOKGUARD_CORS_ORIGINS: https://${HOOKGUARD_DOMAIN}
      HOOKGUARD_APP_BASE_URL: https://${HOOKGUARD_DOMAIN}
      HOOKGUARD_API_BASE_URL: https://${HOOKGUARD_DOMAIN}
      HOOKGUARD_DELIVERY_ALLOW_HTTP: "false"
      HOOKGUARD_EXPOSE_MAGIC_LINK: "false"
      HOOKGUARD_SMTP_HOST: ${HOOKGUARD_SMTP_HOST}
      HOOKGUARD_SMTP_PORT: ${HOOKGUARD_SMTP_PORT:-587}
      HOOKGUARD_SMTP_USER: ${HOOKGUARD_SMTP_USER:-}
      HOOKGUARD_SMTP_PASSWORD: ${HOOKGUARD_SMTP_PASSWORD:-}
      HOOKGUARD_SMTP_AUTH: ${HOOKGUARD_SMTP_AUTH:-true}
      HOOKGUARD_SMTP_STARTTLS: ${HOOKGUARD_SMTP_STARTTLS:-true}
      HOOKGUARD_FROM_EMAIL: ${HOOKGUARD_FROM_EMAIL}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${HOOKGUARD_DOMAIN}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOOKGUARD_DOMAIN: ${HOOKGUARD_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  hookguard_pg:
  caddy_data:
  caddy_config:
