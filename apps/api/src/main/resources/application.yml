spring:
  application:
    name: hookguard-api
  datasource:
    url: ${HOOKGUARD_DB_URL:jdbc:postgresql://localhost:5432/hookguard}
    username: ${HOOKGUARD_DB_USER:hookguard}
    password: ${HOOKGUARD_DB_PASSWORD:hookguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${HOOKGUARD_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

hookguard:
  worker:
    enabled: ${HOOKGUARD_WORKER_ENABLED:true}
    poll-interval-ms: ${HOOKGUARD_WORKER_POLL_MS:1000}
    batch-size: ${HOOKGUARD_WORKER_BATCH:20}
    lock-timeout-seconds: ${HOOKGUARD_WORKER_LOCK_TIMEOUT:60}
  delivery:
    connect-timeout-ms: 3000
    default-timeout-ms: 10000
    max-attempts: 6
    allow-http: ${HOOKGUARD_DELIVERY_ALLOW_HTTP:false}
  retention:
    days: 14
  billing:
    free-monthly-events: 5000
    stripe-api-key: ${STRIPE_API_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    stripe-pro-price-id: ${STRIPE_PRO_PRICE_ID:}
  cors:
    allowed-origins: ${HOOKGUARD_CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    br.com.ricarte.hookguard: INFO
