services:
  postgres:
    build:
      context: ./deploy/images
      dockerfile: postgres.Dockerfile
    image: hookguard-postgres:16
    environment:
      POSTGRES_DB: hookguard
      POSTGRES_USER: hookguard
      POSTGRES_PASSWORD: hookguard
    volumes:
      - hookguard_free_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookguard -d hookguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    # Caixa de e-mail local da demo: só no loopback do host. Não passa pelo Caddy nem pelo túnel.
    ports:
      - "127.0.0.1:18025:8025"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prebuilt
    env_file:
      - path: .env
        required: false
    environment:
      HOOKGUARD_DB_URL: jdbc:postgresql://postgres:5432/hookguard
      HOOKGUARD_DB_USER: hookguard
      HOOKGUARD_DB_PASSWORD: hookguard
      HOOKGUARD_CORS_ORIGINS: http://localhost:9080
      HOOKGUARD_APP_BASE_URL: http://localhost:9080
      HOOKGUARD_API_BASE_URL: http://localhost:9080
      HOOKGUARD_DELIVERY_ALLOW_HTTP: "false"
      # Fixo: a demo tem túnel público, então o link de login nunca volta na resposta da API (ler no Mailpit).
      HOOKGUARD_EXPOSE_MAGIC_LINK: "false"
      HOOKGUARD_TRUST_FORWARDED_HOST: "true"
      HOOKGUARD_FORWARDED_HOST_SUFFIX: trycloudflare.com
      HOOKGUARD_SMTP_HOST: mailpit
      HOOKGUARD_SMTP_PORT: "1025"
      HOOKGUARD_SMTP_AUTH: "false"
      HOOKGUARD_SMTP_STARTTLS: "false"
      HOOKGUARD_FROM_EMAIL: noreply@hookguard.local
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: same-origin
    depends_on:
      - api

  caddy:
    build:
      context: ./deploy/images/caddy
    image: hookguard-caddy:2.11
    ports:
      - "9080:80"
    volumes:
      - ./deploy/Caddyfile.free:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  tunnel:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  hookguard_free_pg:
