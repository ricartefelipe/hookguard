services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: hookguard
      POSTGRES_USER: hookguard
      POSTGRES_PASSWORD: hookguard
    volumes:
      - hookguard_free_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookguard -d hookguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "18025:8025"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prebuilt
    env_file:
      - path: .env
        required: false
    environment:
      HOOKGUARD_DB_URL: jdbc:postgresql://postgres:5432/hookguard
      HOOKGUARD_DB_USER: hookguard
      HOOKGUARD_DB_PASSWORD: hookguard
      HOOKGUARD_CORS_ORIGINS: http://localhost:9080
      HOOKGUARD_APP_BASE_URL: http://localhost:9080
      HOOKGUARD_API_BASE_URL: http://localhost:9080
      HOOKGUARD_DELIVERY_ALLOW_HTTP: "false"
      HOOKGUARD_EXPOSE_MAGIC_LINK: "true"
      HOOKGUARD_TRUST_FORWARDED_HOST: "true"
      HOOKGUARD_FORWARDED_HOST_SUFFIX: trycloudflare.com
      HOOKGUARD_SMTP_HOST: mailpit
      HOOKGUARD_SMTP_PORT: "1025"
      HOOKGUARD_SMTP_AUTH: "false"
      HOOKGUARD_SMTP_STARTTLS: "false"
      HOOKGUARD_FROM_EMAIL: noreply@hookguard.local
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: same-origin
    depends_on:
      - api

  caddy:
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    ports:
      - "9080:80"
    volumes:
      - ./deploy/Caddyfile.free:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  tunnel:
    image: cloudflare/cloudflared:latest@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  hookguard_free_pg:
